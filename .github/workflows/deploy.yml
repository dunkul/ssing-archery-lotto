# main 에 push 하면 GitHub Pages 로 배포한다.
# 매주 토요일 추첨 후에도 다시 빌드해서 draws.json 에 새 회차를 넣는다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 방문자 브라우저는 동행복권 API 를 부르지 않으므로 새 회차는 이 예약 빌드로만 들어온다
  schedule:
    - cron: "0 13 * * 6" # 토 22:00 KST (추첨 20:45 KST) — 새 회차 번호
    - cron: "0 0 * * 0" # 일 09:00 KST — 토요일엔 집계 중이던 당첨금 채우기
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # prebuild 로 당첨번호를 갱신한다. 실패해도 저장소의 draws.json 으로 빌드는 계속된다.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
